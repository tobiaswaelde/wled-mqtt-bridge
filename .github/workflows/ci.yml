name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build && pnpm docs:build
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: wled-mqtt-bridge:ci }
      - name: Smoke-test health endpoint
        run: |
          cp config/config.example.yml /tmp/config.yml
          docker run -d --name bridge-ci -p 3000:3000 -v /tmp/config.yml:/app/config/config.yml:ro wled-mqtt-bridge:ci
          for _ in {1..20}; do curl --fail --silent http://127.0.0.1:3000/health && exit 0; sleep 1; done
          docker logs bridge-ci
          exit 1
      - name: Cleanup smoke container
        if: always()
        run: docker rm -f bridge-ci || true
